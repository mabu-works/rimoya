name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the web scripts
        run: |
          node --check js/rimoya-core.js
          node --check viewer.js
          node --check host.js
          node --check sw.js
      - name: Run unit tests
        run: node --test tests/*.test.js
